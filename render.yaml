# Render Blueprint for NC Telearning Backend
# This file configures the backend API and PostgreSQL database on Render

services:
  # PostgreSQL Database
  - type: pg
    name: nctelearning-db
    plan: free  # Change to 'starter' or higher for production
    databaseName: nctelearning
    user: nct_user
    # Note: Password will be auto-generated by Render
    # You'll need to add it to the backend service environment variables

  # Backend API Service
  - type: web
    name: nctelearning-backend
    env: node
    plan: free  # Change to 'starter' or higher for production
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render uses port 10000 by default
      - key: DATABASE_TYPE
        value: postgres
      # Database connection - these will be set from the PostgreSQL service
      # DATABASE_HOST, DATABASE_PORT, DATABASE_NAME, DATABASE_USER, DATABASE_PASSWORD
      # will be automatically provided by Render when you link the services
      - key: DATABASE_SSL
        value: "true"
      # JWT Configuration - CHANGE THESE IN PRODUCTION
      - key: JWT_SECRET
        generateValue: true  # Render will generate a secure random value
      - key: JWT_EXPIRES_IN
        value: 24h
      # CORS - Update with your Vercel frontend URL after deployment
      - key: CORS_ORIGIN
        value: https://your-frontend.vercel.app  # Update this after Vercel deployment
      # File Upload Configuration
      - key: MAX_FILE_SIZE
        value: "104857600"  # 100MB in bytes
      - key: UPLOAD_DEST
        value: ./uploads

