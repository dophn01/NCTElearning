# Render Blueprint for NC Telearning - Full Stack Deployment
# This file configures frontend, backend API, and PostgreSQL database on Render

databases:
  # PostgreSQL Database
  - name: nctelearning-db
    plan: free  # Change to 'starter' or higher for production
    postgresMajorVersion: 15
    databaseName: nctelearning
    user: nct_user
    # Note: Password will be auto-generated by Render

services:
  # Backend API Service
  - type: web
    name: nctelearning-backend
    env: node
    plan: free  # Change to 'starter' or higher for production
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render uses port 10000 by default
      - key: DATABASE_TYPE
        value: postgres
      # Database connection - use fromDatabase to auto-link
      - key: DATABASE_URL
        fromDatabase:
          name: nctelearning-db
          property: connectionString
      - key: DATABASE_HOST
        fromDatabase:
          name: nctelearning-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: nctelearning-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: nctelearning-db
          property: database
      - key: DATABASE_USER
        fromDatabase:
          name: nctelearning-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: nctelearning-db
          property: password
      - key: DATABASE_SSL
        value: "true"
      # JWT Configuration
      - key: JWT_SECRET
        generateValue: true  # Render will generate a secure random value
      - key: JWT_EXPIRES_IN
        value: 24h
      # CORS - Will be updated with frontend URL after deployment
      - key: CORS_ORIGIN
        value: https://nctelearning-frontend.onrender.com  # Update after frontend deploys
      # File Upload Configuration
      - key: MAX_FILE_SIZE
        value: "104857600"  # 100MB in bytes
      - key: UPLOAD_DEST
        value: ./uploads

  # Frontend Next.js Service
  - type: web
    name: nctelearning-frontend
    env: node
    plan: free  # Change to 'starter' or higher for production
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render uses port 10000 by default
      # Backend API URL - Update with your actual backend URL after deployment
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://nctelearning-backend.onrender.com
